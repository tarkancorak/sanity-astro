name: Deploy Astro site via SCP

on:
  push:
    branches: ['master']
  workflow_dispatch:

# Only one deploy at a time: back-to-back pushes to master would otherwise
# race, each scp-ing into the same live webspace. cancel-in-progress means a
# newer run simply supersedes a stale one instead of queuing behind it.
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # SITE_RUNNER=self-hosted: runner from supavesta/infra/runner while the Actions minutes are used up.
    runs-on: ${{ vars.SITE_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockfile=yarn.lock" >> $GITHUB_OUTPUT
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockfile=package-lock.json" >> $GITHUB_OUTPUT
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          cache-dependency-path: ${{ steps.detect-package-manager.outputs.lockfile }}

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Astro
        run: |
          ${{ steps.detect-package-manager.outputs.runner }} astro build

      - name: Write SMTP secret
        # Writes the SMTP password from the GitHub secret into dist/smtp-secret.php
        # (never committed), which kontakt.php reads. base64 avoids shell escaping;
        # the file is PHP and is never served as source by Apache. Deploy-gated.
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -n "$SMTP_PASSWORD" ]; then
            ENC=$(printf '%s' "$SMTP_PASSWORD" | base64 -w0)
            printf "<?php return base64_decode('%s');\n" "$ENC" > dist/smtp-secret.php
            echo "smtp-secret.php written."
          else
            echo "::warning::SMTP_PASSWORD is empty - the contact form cannot send mail."
          fi

      - name: Install sshpass
        # Only run the SCP deploy when it is armed. Default (variable unset) =>
        # the deploy step is skipped and the run stays green (build only).
        # To enable, set the repo variable DEPLOY_ENABLED=true and add the SSH secrets.
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        run: |
          if ! command -v sshpass &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y sshpass
          else
            echo "sshpass is already installed"
          fi

      - name: Deploy via SCP
        if: ${{ vars.DEPLOY_ENABLED == 'true' }}
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          # Repo variable (Settings → Secrets and variables → Actions → Variables).
          # Empty/unset => deploy into the webspace root.
          # For a subfolder set e.g. "/my-site".
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          TARGET="${DEPLOY_PATH:-/}"
          # Create the target folder (scp does not create directories). On IONOS
          # 'ssh mkdir' fails against a read-only root, so we use SFTP (chrooted to
          # the webspace, which is writable). Ignore errors if the folder already
          # exists. Assumption: one level below the webspace root.
          if [ "$TARGET" != "/" ]; then
            # -mkdir ignores "already exists"; chmod 755 restores the traverse (x)
            # bit so Apache can enter the dir (SFTP mkdir creates it 704 -> 403).
            printf '%s\n' "-mkdir $TARGET" "chmod 755 $TARGET" | sshpass -p "$SSH_PASSWORD" sftp -o StrictHostKeyChecking=no -b - "$SSH_USERNAME@$SSH_HOST" || true
          fi
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -p -r dist/* "$SSH_USERNAME@$SSH_HOST:$TARGET"
